[project]
name = "codebrain"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
sentence-transformers = ["sentence-transformers>=3.0"]
minimal = []
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
milvus = ["pymilvus>=2.4"]
milvus-lite = ["pymilvus[milvus-lite]>=2.4"]

[project.scripts]
codebrain = "codebrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebrain"]
